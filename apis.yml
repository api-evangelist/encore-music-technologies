name: Encore Music Technologies
description: >-
  Encore Music Technologies, Inc. ("Encore") is a consumer live-music technology
  company based in Los Angeles, California, founded in 2020 by Ian Edelman,
  Jonathan Gray, and recording artist Kid Cudi. Its mobile app lets artists
  perform live inside custom augmented-reality environments directly from a
  phone while fans join, react, and pay artists in real time through gamified
  microtransactions such as a ten-cent "clap." The company raised a $9M seed
  round led by Battery Ventures in February 2022, with participation from 468
  Capital, Kayak Ventures, Parade Ventures, and others. Encore ships consumer
  iOS and Android apps rather than a public developer platform; as of this pass
  it exposes no documented public API, and its marketing website (clapforencore.com)
  does not currently resolve to a live server.
